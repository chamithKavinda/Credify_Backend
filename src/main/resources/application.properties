server.port=${PORT:8080}
spring.application.name=credify-backend
spring.jackson.default-property-inclusion=non_null
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/credify_db}
spring.data.mongodb.auto-index-creation=true
credify.jwt.secret=${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-secret-123456}
credify.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
credify.ai.url=${AI_SERVICE_URL:http://localhost:8000}
